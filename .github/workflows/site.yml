# Builds and publishes the site to GitHub Pages (free).
#  - on every push to main: build and deploy
#  - every Monday 03:17 UTC: refresh publications/citations from ORCID, Crossref, OpenAlex and Google Scholar,
#    commit any changes, then build and deploy
#  - manually (Actions tab > "Build and deploy site" > Run workflow): same as the weekly run, with an option
#    to copy all gallery images from the old WordPress site into the repository
name: Build and deploy site

on:
  push:
    branches: [main]
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:
    inputs:
      update_publications:
        description: "Refresh publications and citation metrics"
        type: boolean
        default: true
      localize_images:
        description: "Copy gallery images from WordPress into this repository (run once)"
        type: boolean
        default: false

permissions:
  contents: write   # to commit refreshed data
  pages: write      # to deploy to GitHub Pages
  id-token: write   # required by deploy-pages

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install Python packages
        run: pip install -r requirements.txt

      - name: Refresh publications and metrics
        if: github.event_name == 'schedule' || (github.event_name == 'workflow_dispatch' && inputs.update_publications)
        env:
          SERPAPI_KEY: ${{ secrets.SERPAPI_KEY }}
        run: python tools/update_publications.py
        continue-on-error: true

      - name: Copy gallery images into the repository
        if: github.event_name == 'workflow_dispatch' && inputs.localize_images
        run: python tools/localize_images.py

      - name: Commit refreshed data
        if: github.event_name != 'push'
        run: |
          git config user.name "site-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets/img
          if git diff --cached --quiet; then echo "No data changes."; else
            git commit -m "Refresh publications, metrics and media [automated]"
            git push
          fi

      - id: pages
        uses: actions/configure-pages@v5

      - name: Compile the CV
        uses: xu-cheng/latex-action@v4
        with:
          root_file: Salisu_CV.tex
          working_directory: cv
          pre_compile: sed -i "s#https://sanisalisu.github.io#${{ steps.pages.outputs.base_url }}#" Salisu_CV.tex
        continue-on-error: true

      - name: Use the compiled CV
        run: if [ -f cv/Salisu_CV.pdf ]; then mkdir -p assets/cv && cp cv/Salisu_CV.pdf assets/cv/Salisu_CV.pdf; fi

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Self-host KaTeX and fonts
        run: bash tools/vendor.sh

      - name: Build
        env:
          SITE_URL: ${{ steps.pages.outputs.base_url }}
        run: python tools/build.py

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deploy
        uses: actions/deploy-pages@v4
